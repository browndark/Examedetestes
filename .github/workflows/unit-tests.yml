name: Testes Unitarios (Quick)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.0'
    
    - name: Restaurar dependencias
      working-directory: ./api
      run: dotnet restore --no-cache
    
    - name: Build
      working-directory: ./api
      run: dotnet build MinhasFinancas.Tests.Unit --configuration Release --no-restore
    
    - name: Executar testes unitarios
      working-directory: ./api
      run: dotnet test MinhasFinancas.Tests.Unit --configuration Release --no-build --logger console --verbosity normal
    
    - name: Executar testes integracao
      working-directory: ./api
      run: dotnet test MinhasFinancas.Tests.Integration --configuration Release --no-build --logger console --verbosity normal
      continue-on-error: true
