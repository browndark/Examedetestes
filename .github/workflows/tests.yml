name: Testes Automáticos

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dotnet-version: ['9.0.x']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restaurar dependências
      run: dotnet restore api/MinhasFinancas.slnx
    
    - name: Build
      run: dotnet build api/MinhasFinancas.slnx --configuration Release --no-restore
    
    - name: Executar Testes Unitários
      run: dotnet test api/MinhasFinancas.Tests.Unit --configuration Release --no-build --logger "console;verbosity=detailed"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Verificar testes E2E
      run: echo "Testes E2E - Infraestrutura pronta, aguardando implementação de testes Playwright"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Informar status de qualidade
      run: echo "Infraestrutura de qualidade de código pronta (SonarQube opcional)"
