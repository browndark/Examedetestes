name: Testes Automaticos

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.0'
    
    - name: Restaurar dependencias
      working-directory: ./api
      run: dotnet restore --no-cache
    
    - name: Build projeto
      working-directory: ./api
      run: dotnet build MinhasFinancas.Tests.Unit --configuration Release --no-restore
    
    - name: Executar testes
      working-directory: ./api
      run: dotnet test MinhasFinancas.Tests.Unit --configuration Release --no-build --logger console --verbosity normal

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Status E2E
      run: echo "Testes E2E - Infraestrutura pronta (aguardando testes Playwright)"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Status qualidade
      run: echo "Qualidade de codigo - Pronto para SonarQube"
