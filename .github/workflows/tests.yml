name: Testes Automáticos

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dotnet-version: ['9.0.x']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restaurar dependências
      run: dotnet restore api/MinhasFinancas.slnx
    
    - name: Build
      run: dotnet build api/MinhasFinancas.slnx --configuration Release --no-restore
    
    - name: Executar Testes Unitários
      run: dotnet test api/MinhasFinancas.Tests.Unit --configuration Release --no-build --logger "console;verbosity=detailed" --logger "trx;LogFileName=test-results.trx"
    
    - name: Publicar Resultados de Testes
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Relatório de Testes Unitários
        path: '**/test-results.trx'
        reporter: 'dotnet trx'

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    strategy:
      matrix:
        node-version: ['18.x']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Instalar dependências frontend
      run: cd web && npm install
    
    - name: Instalar Playwright
      run: cd web && npx playwright install
    
    - name: Setup .NET (para API)
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    
    - name: Iniciar API em background
      run: |
        cd api
        dotnet build MinhasFinancas.slnx --configuration Release
        nohup dotnet run --project MinhasFinancas.API/MinhasFinancas.API.csproj --configuration Release &
        sleep 10
    
    - name: Executar Testes E2E
      run: cd web && npx playwright test
    
    - name: Upload Artefatos E2E
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: web/playwright-report/
        retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: SonarQube Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      if: env.SONAR_TOKEN != ''
